<header class="head">
  <span class="num">PROJECT 10</span>
  <h1>Phantom Images on the Ruins<span class="zh-title">《废墟上的幻影图像》· 个人装置</span></h1>
  <div class="meta">
    <span><b>年份</b> 2024</span>
    <span><b>类型</b> 装置 Installation</span>
    <span><b>角色</b> 艺术家 Artist</span>

<main class="body">
  <p class="lead"><span class="serif">Phantom Images on the Ruins</span> 是一件以数字影像为媒介的装置作品：由多块方形数字影像模块拼接而成的墙面，以蓝黑为主的色调呈现出故障艺术、数据纹理与科技感的视觉。模块排布错落有致，部分位置留有空白，如同记忆与废墟上残留的幻影。</p>

  <figure class="fig">
    <img src="assets/phantom-01.png" alt="白墙上由多块方形数字影像模块拼接而成的装置">
    <figcaption>Phantom Images on the Ruins — 墙面装置全景</figcaption>
  </figure>
  <figure class="fig">
    <img src="assets/phantom-02.jpg" alt="三位观众在白墙前观赏作品">
    <figcaption>观众驻足 — 装置与观者</figcaption>
  </figure>
  <figure class="fig">
    <img src="assets/phantom-03.jpg" alt="展厅中多组作品：小幅画作、方形拼贴与几何装置">
    <figcaption>展览现场 — 拼贴与装置并置</figcaption>
  </figure>
  <figure class="fig">
    <img src="assets/phantom-04.jpg" alt="拱形展厅中观众观看摄影与影像作品">
    <figcaption>展厅环境 — 影像序列</figcaption>
  </figure>
  <figure class="fig">
    <img src="assets/phantom-05.jpg" alt="男子背身观看深色方形拼接装置">
    <figcaption>观者与装置 — 近距离凝视</figcaption>
  </figure>
  <figure class="fig">

  </figure>
